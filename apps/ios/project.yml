name: JasmineBotIOS
options:
  bundleIdPrefix: com.jasmine.bot
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  JasmineMobileCore:
    path: Packages/JasmineMobileCore

targets:
  JasmineBotIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: JasmineBotIOS
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: JasmineBotIOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.jasmine.bot.ios
        PRODUCT_NAME: JasmineBot
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: JasmineMobileCore
        product: JasmineMobileCore
